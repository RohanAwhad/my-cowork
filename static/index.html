<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-work Workspace</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Co-work</h1>
    <nav>
      <button class="nav-btn active" data-section="sessions">Sessions</button>
      <button class="nav-btn" data-section="tasks">Tasks</button>
      <button class="nav-btn" data-section="connectors">Connectors</button>
      <button class="nav-btn" data-section="settings">Settings</button>
      <button class="nav-btn" data-section="memory">Memory</button>
    </nav>
    <span id="ws-status" class="ws-indicator disconnected">WS</span>
  </header>

  <div id="toast-container"></div>

  <main>
    <!-- Sessions -->
    <section id="section-sessions" class="section active">
      <div class="section-split">
        <div class="panel panel-left">
          <h2>New Session</h2>
          <form id="session-form">
            <label for="session-prompt">Prompt</label>
            <textarea id="session-prompt" rows="4" placeholder="Enter a prompt for the agent..."></textarea>
            <button type="submit">Create Session</button>
          </form>
          <h2>Sessions</h2>
          <ul id="session-list" class="entity-list"></ul>
        </div>
        <div class="panel panel-right">
          <div id="session-detail" class="detail-pane">
            <p class="placeholder-text">Select a session to view details</p>
          </div>
          <div id="event-stream" class="event-stream">
            <h3>Event Stream</h3>
            <div id="event-log" class="event-log"></div>
          </div>
          <div id="artifact-section">
            <h3>Artifacts</h3>
            <div id="artifact-list" class="artifact-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tasks -->
    <section id="section-tasks" class="section">
      <h2>Scheduled Tasks</h2>
      <form id="task-form" class="inline-form">
        <input type="text" id="task-name" placeholder="Task name" required>
        <select id="task-cadence">
          <option value="manual">Manual</option>
          <option value="hourly">Hourly</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="weekdays">Weekdays</option>
        </select>
        <input type="text" id="task-cron" placeholder="Custom cron (optional)">
        <textarea id="task-prompt" rows="2" placeholder="Task prompt" required></textarea>
        <button type="submit">Create Task</button>
      </form>
      <ul id="task-list" class="entity-list"></ul>
    </section>

    <!-- Connectors -->
    <section id="section-connectors" class="section">
      <h2>MCP Connectors</h2>
      <form id="connector-form" class="inline-form">
        <input type="text" id="connector-name" placeholder="Connector name" required>
        <input type="text" id="connector-command" placeholder="Command" required>
        <input type="text" id="connector-args" placeholder="Args (comma-separated)">
        <button type="submit">Add Connector</button>
      </form>
      <ul id="connector-list" class="entity-list"></ul>
    </section>

    <!-- Settings -->
    <section id="section-settings" class="section">
      <h2>Settings</h2>
      <form id="settings-form">
        <div class="settings-grid" id="settings-fields"></div>
        <button type="submit">Save Settings</button>
      </form>
    </section>

    <!-- Memory -->
    <section id="section-memory" class="section">
      <h2>Memory</h2>
      <div id="memory-info" class="memory-info"></div>
      <textarea id="memory-content" rows="12" placeholder="Memory content..."></textarea>
      <button id="memory-save">Save Memory</button>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
